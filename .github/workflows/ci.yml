name: Weather ETL Pipeline CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Download PostgreSQL JDBC Driver
      run: |
        mkdir -p drivers
        if [ ! -f drivers/postgresql-42.7.13.jar ]; then
          curl -s -L -o drivers/postgresql-42.7.13.jar https://jdbc.postgresql.org/download/postgresql-42.7.13.jar
        fi

    - name: Run Unit Tests
      run: |
        python -m unittest tests/test_validator.py tests/test_settings.py tests/test_transform.py
